<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poster Gallery | Poster King</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5fb;color:#241735;font:15px system-ui,sans-serif}header{position:sticky;top:0;background:white;padding:14px;display:flex;align-items:center;gap:15px;box-shadow:0 2px 8px #0001;z-index:3}a{color:#6022ad;text-decoration:none;font-weight:bold}.wrap{max-width:1100px;margin:auto;padding:16px}h1{font-size:24px;margin:6px 0}.sub{color:#766b86}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{border:0;border-radius:16px;background:white;padding:8px;box-shadow:0 2px 12px #0001;text-align:left;cursor:pointer}.art{aspect-ratio:4/5;border-radius:11px;color:white;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;padding:12px;text-align:center}.art .symbol{font-size:48px}.art strong{font-size:19px;line-height:1.5}.art p{font-size:12px;line-height:1.5;margin:0}.art:before{content:'';border:2px solid #ffffff44;border-radius:50%;width:150px;height:150px;position:absolute;right:-70px;top:-65px}.wm{position:absolute;bottom:8px;right:8px;background:#fff;color:#59239b;padding:4px 7px;border-radius:6px;font-size:10px}.label{font-weight:700;padding:9px 3px}.search{width:100%;border:1px solid #e5ddef;padding:13px;border-radius:11px;margin:15px 0;background:white}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:390px){.art strong{font-size:16px}.art .symbol{font-size:37px}}</style></head><body><header><a href="./">← Home</a><b>👑 Poster King Gallery</b></header><main class="wrap"><h1 id="title"></h1><p class="sub">Ready-made Designs પસંદ કરો અને તમારો ફોટો, Logo, નામ તથા લખાણ ઉમેરો.</p><input class="search" id="search" placeholder="🔎 Search designs"><div class="grid" id="grid"></div></main><script>const params=new URLSearchParams(location.search),category=params.get('category')||'Morning',title=document.getElementById('title'),grid=document.getElementById('grid');title.textContent='✨ '+category+' Ready-made Posters';const names={Morning:['🌅','શુભ સવાર','દરેક સવાર નવી આશા લઈને આવે છે'],Night:['🌙','શુભ રાત્રી','સુંદર સપનાઓ સાથે શુભ રાત્રી'],Suvichar:['💡','આજનો સુવિચાર','સકારાત્મક વિચારો જીવન બદલે છે'],Diwali:['🪔','શુભ દિવાળી','સુખ અને સમૃદ્ધિની શુભકામનાઓ'],Navratri:['💃','શુભ નવરાત્રી','માતાજીના આશીર્વાદ સદા રહે'],Birthday:['🎂','જન્મદિવસની શુભેચ્છાઓ','આનંદભર્યા જીવનની શુભકામનાઓ'],Afternoon:['☀️','શુભ બપોર','આપનો દિવસ સુંદર રહે'],Evening:['🌇','શુભ સાંજ','સુંદર સાંજની શુભકામનાઓ'],Janmashtami:['🪈','શુભ જન્માષ્ટમી','જય શ્રી કૃષ્ણ'],Holi:['🎨','હોળીની શુભકામનાઓ','રંગો તમારા જીવનમાં ખુશી ભરે'],Business:['🏪','વ્યવસાયની શુભેચ્છા','સફળતાની શુભકામનાઓ'],Devotional:['🙏','જય શ્રી કૃષ્ણ','ભગવાનના આશીર્વાદ સદા રહે'], 'New Year':['🎉','નવા વર્ષની શુભકામનાઓ','નવું વર્ષ સુખમય રહે']};const item=names[category]||['🎉',category,'શુભેચ્છાઓ'];const palettes=[['#e58e3c','#813258'],['#223d80','#6c35a5'],['#188776','#164052'],['#c03c73','#59247d'],['#a97a2a','#4d2b72'],['#d65b42','#6e266c'],['#31699d','#13294f'],['#8c3ea2','#35246a'],['#ad5c29','#5d193e'],['#26827b','#233366']];function render(){grid.innerHTML='';const query=document.getElementById('search').value.toLowerCase();for(let i=0;i<30;i++){const name=category+' Design '+(i+1);if(query&&!name.toLowerCase().includes(query))continue;const p=palettes[i%palettes.length],b=document.createElement('button');b.className='card';const art=document.createElement('div');art.className='art';art.style.background='linear-gradient('+(110+(i%6)*25)+'deg,'+p[0]+','+p[1]+')';const icon=document.createElement('span');icon.className='symbol';icon.textContent=item[0];const heading=document.createElement('strong');heading.textContent=item[1];const quote=document.createElement('p');quote.textContent=item[2];const mark=document.createElement('span');mark.className='wm';mark.textContent='👑 Poster King';art.append(icon,heading,quote,mark);const label=document.createElement('div');label.className='label';label.textContent='Design '+(i+1)+' · Customize';b.append(art,label);b.onclick=()=>location.href='./editor.html?template='+encodeURIComponent(category)+'&design='+(i%10);grid.append(b)}}document.getElementById('search').oninput=render;render();</script></body></html>
