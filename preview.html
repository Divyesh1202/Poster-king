<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poster Preview | Poster King</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2fa;color:#251739;font:15px system-ui,sans-serif}header{background:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}a{color:#6025ad;text-decoration:none;font-weight:700}.wrap{max-width:620px;margin:auto;padding:14px}.preview{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 20px #0001}canvas{width:100%;max-width:430px;display:block;margin:auto;border-radius:10px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}button{border:0;border-radius:12px;background:#6024b1;color:#fff;padding:15px 5px;font-weight:700;font-size:14px}.secondary{background:#ede6f8;color:#55218f}p{color:#70677d;font-size:13px;text-align:center}h2{text-align:center;font-size:21px}@media(max-width:370px){button{font-size:12px}}</style></head><body><header><a href="./">← Home</a><b>👑 Poster King</b></header><main class="wrap"><h2 id="title">Ready-made Poster</h2><div class="preview"><canvas id="poster" width="1080" height="1350"></canvas></div><div class="actions"><button id="download">⬇ Download</button><button id="share">↗ Share</button><button class="secondary" id="edit">✎ Edit</button></div><p>Download અથવા Share માટે Editing જરૂરી નથી. ફેરફાર કરવા Edit દબાવો.</p></main><script>

.push(line);lines.forEach((l,i)=>ctx.fillText(l,540,720+i*68));ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(755,1260,300,64,12);ctx.fill();ctx.fillStyle='#572394';ctx.font='bold 31px sans-serif';ctx.fillText('👑 Poster King',905,1294);
function download(){const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='poster-king-'+category+'-'+(design+1)+'.png';document.body.append(a);a.click();a.remove()}document.getElementById('download').onclick=download;document.getElementById('edit').onclick=()=>location.href='./editor.html?template='+encodeURIComponent(category)+'&design='+design;document.getElementById('share').onclick=()=>c.toBlob(async blob=>{const file=new File([blob],'poster-king.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Poster King'});else download()}catch(e){if(e.name!=='AbortError')download()}},'image/png');
