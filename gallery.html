<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./pk-style.css"><title>Poster Gallery | Poster King</title></head><body><header><div class="topbar"><a href="./categories.html">← Categories</a><b>👑 Poster Gallery</b></div></header><main class="shell"><h1 id="title"></h1><p class="muted">Poster પસંદ કરો → Download, Share અથવા Edit</p><div class="pill-row" id="filters"></div><div class="grid" id="grid"></div><div class="actions" style="margin:20px 0"><button class="outline" id="more">Load More Designs</button></div><p class="muted" style="font-size:12px">હાલ 12 મૂળભૂત color palettes અને 5 layouts સાથે generated designs છે; હજારો અલગ artist-made templates હજી ઉપલબ્ધ નથી.</p></main><script src="./pk-core.js"></script><script>const q=new URLSearchParams(location.search);let category=q.get('category')||'Morning',shown=0;const valid=PK.categories.map(c=>c[0]);if(!valid.includes(category))category='Morning';PK.$('title').textContent=PK.categories.find(c=>c[0]===category)[1]+' '+category+' Posters';const filter=PK.$('filters');PK.categories.forEach(c=>{const b=document.createElement('button');b.className='pill'+(c[0]===category?' active':'');b.textContent=c[1]+' '+c[2];b.onclick=()=>location.href='./gallery.html?category='+encodeURIComponent(c[0]);filter.append(b)});function load(){const g=PK.$('grid');for(let i=shown;i<shown+24;i++){const t=PK.template(category,i);g.append(PK.card(t,()=>location.href='./preview.html?category='+encodeURIComponent(category)+'&design='+i))}shown+=24}PK.$('more').onclick=load;load();</script></body></html>
