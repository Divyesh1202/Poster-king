<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./pk-style.css"><title>Categories | Poster King</title></head><body class="has-nav"><header><div class="topbar"><a href="./">← Home</a><b>👑 All Categories</b></div></header><main class="shell"><h1>Explore Categories</h1><input class="search" id="search" placeholder="Search categories"><div class="grid" id="grid"></div></main><nav class="bottom-nav"><a href="./"><span>⌂</span>Home</a><a href="./categories.html" class="active"><span>▦</span>Categories</a><a href="./editor.html"><span>✚</span>Create</a><a href="./saved.html"><span>▧</span>My Posters</a><a href="./profile.html"><span>♙</span>Profile</a></nav><script src="./pk-core.js"></script><script>function draw(){const q=PK.$('search').value.toLowerCase(),g=PK.$('grid');g.innerHTML='';PK.categories.forEach(c=>{if(q&&!c.join(' ').toLowerCase().includes(q))return;const t=PK.template(c[0],0),card=PK.card(t,()=>location.href='./gallery.html?category='+encodeURIComponent(c[0]));card.querySelector('span').textContent=c[2]+' • '+c[3];g.append(card)})}PK.$('search').oninput=draw;draw();</script></body></html>
