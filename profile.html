<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./pk-style.css"><title>Profile | Poster King</title><style>label{display:block;margin:14px 0 6px;font-weight:700}input{width:100%;border:1px solid #e4dbef;border-radius:10px;padding:12px}.panel{max-width:650px;margin:14px auto}</style></head><body class="has-nav"><header><div class="topbar"><a href="./">← Home</a><b>👤 My Profile</b></div></header><main class="shell"><section class="panel"><h2>My Poster Details</h2><p class="muted">તમારી માહિતી આ જ Device પર Save થશે. કોઈ Account અથવા Server Upload નથી.</p><label>Name</label><input id="name" placeholder="તમારું નામ"><label>Designation / Business</label><input id="designation" placeholder="Business or designation"><label>Phone</label><input id="phone" placeholder="Mobile number"><label>Address</label><input id="contact" placeholder="Address"><label>Email</label><input id="email" type="email" placeholder="Email"><label>Photo</label><input id="photo" type="file" accept="image/*"><label>Logo</label><input id="logo" type="file" accept="image/*"><div class="actions" style="margin-top:16px"><button class="primary" id="save">Save Profile</button><button class="outline" id="clear">Clear</button></div><p class="muted">Editor માં “Add Saved Profile” થી તમારું નામ અને ફોટો ઉમેરો. Contact details અલગ Text તરીકે ઉમેરવા માટે Editor નો Add Menu વાપરો.</p></section></main><nav class="bottom-nav"><a href="./"><span>⌂</span>Home</a><a href="./categories.html"><span>▦</span>Categories</a><a href="./editor.html"><span>✚</span>Create</a><a href="./saved.html"><span>▧</span>My Posters</a><a href="./profile.html" class="active"><span>♙</span>Profile</a></nav><script>const ids=['name','designation','phone','contact','email'];let o={};try{o=JSON.parse(localStorage.getItem('pk_daily_profile')||'{}')}catch(e){}ids.forEach(id=>document.getElementById(id).value=o[id]||'');function read(file){return new Promise(resolve=>{if(!file)return resolve(null);const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=250;c.getContext('2d').drawImage(im,0,0,250,250);resolve(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(file)})}document.getElementById('save').onclick=async()=>{ids.forEach(id=>o[id]=document.getElementById(id).value);for(const k of ['photo','logo']){const f=document.getElementById(k).files[0];if(f)o[k]=await read(f)}try{localStorage.setItem('pk_daily_profile',JSON.stringify(o));alert('Profile saved on this device')}catch(e){alert('Unable to save. Browser storage may be full.')}};document.getElementById('clear').onclick=()=>{if(confirm('Clear saved profile?')){localStorage.removeItem('pk_daily_profile');location.reload()}};</script></body></html>
