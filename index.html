</style></head><body class="has-nav"><header><div class="topbar"><div class="brand">👑 Poster <em>King</em></div><div class="header-tools"><a class="premium" href="./categories.html">♛ Premium</a><a href="./profile.html" aria-label="Profile">☻</a></div></div><div class="searchbar"><input id="search" placeholder="⌕ પોસ્ટર શોધો... (Good Morning, Diwali, Suvichar)"></div></header><main class="shell"><div class="quick" id="quick"></div><div class="featured"><div class="copy"><h1>શુભ સવાર</h1><p>નવી સવાર, નવી આશા,<br>નવો ઉત્સાહ અને નવી સફળતા</p><button onclick="location.href='./gallery.html?category=Morning'">પોસ્ટર જુઓ →</button></div></div><div id="sections"></div></main><nav class="bottom-nav"><a href="./" class="active"><span>⌂</span>Home</a><a href="./categories.html"><span>▦</span>Categories</a><a href="./editor.html"><span>＋</span>Create</a><a href="./saved.html"><span>▧</span>My Posters</a><a href="./profile.html"><span>♙</span>Profile</a></nav><script src="./pk-core.js"></script><script>
const $=PK.$,hr=new Date().getHours(),current=hr<11?'Morning':hr<16?'Afternoon':hr<20?'Evening':'Night';const shortcuts=[['Morning','🌅','શુભ સવાર'],['Night','🌙','શુભ રાત્રી'],['Suvichar','💬','સુવિચાર'],['Diwali','🪔','તહેવાર'],['Birthday','🎂','જન્મદિવસ'],['Devotional','🙏','ભક્તિ'],['Business','💼','બિઝનેસ']];shortcuts.forEach(([id,emoji,name])=>{const a=document.createElement('a');a.href='./gallery.html?category='+encodeURIComponent(id);a.innerHTML='<span class="emoji">'+emoji+'</span>'+name;$('quick').append(a)});
const sections=[['🔥 Aajna Picks',[current,'Suvichar','Diwali','Birthday','Devotional']],['🌅 Good Morning (શુભ સવાર)',['Morning']],['💬 Daily Suvichar (આજનો સુવિચાર)',['Suvichar']],['🌙 Good Night (શુભ રાત્રી)',['Night']],['🪔 Festival Greetings',['Diwali','Navratri','Janmashtami','Holi']],['🎂 Birthday & Wishes',['Birthday','Anniversary']],['🙏 Devotional',['Devotional']]];
function render(){const q=$('search').value.trim().toLowerCase(),host=$('sections');host.innerHTML='';sections.forEach(([title,cats])=>{const matching=cats.filter(c=>!q||c.toLowerCase().includes(q)||PK.categories.find(x=>x[0]===c)?.slice(1,5).join(' ').toLowerCase().includes(q));if(!matching.length)return;const section=document.createElement('section');section.className='section';const head=document.createElement('div');head.className='section-title';const h=document.createElement('h2');h.textContent=title;const link=document.createElement('a');link.href='./gallery.html?category='+encodeURIComponent(matching[0]);link.textContent='બધા જુઓ →';head.append(h,link);const shelf=document.createElement('div');shelf.className='shelf';for(let i=0;i<6;i++){const cat=matching[i%matching.length],t=PK.template(cat,i);shelf.append(PK.card(t,()=>location.href='./preview.html?category='+encodeURIComponent(cat)+'&design='+i))}section.append(head,shelf);host.append(section)})}$('search').oninput=render;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
