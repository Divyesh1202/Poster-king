<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./pk-style.css"><title>Poster Preview | Poster King</title></head><body><header><div class="topbar"><a id="back" href="./gallery.html">← Gallery</a><b>👑 Poster Preview</b></div></header><main class="shell" style="max-width:650px"><h2 id="title" style="text-align:center"></h2><section class="panel"><canvas id="poster" class="preview-canvas" width="1080" height="1350"></canvas></section><div class="actions" style="margin:14px 0"><button class="primary" id="download">⬇ Download</button><button class="primary" id="share">↗ Share</button><button class="outline" id="edit">✎ Edit</button></div><p class="muted" style="text-align:center">No editing needed to download or share.</p></main><script src="./pk-core.js"></script><script>const q=new URLSearchParams(location.search),category=q.get('category')||'Morning',design=Math.max(0,Number(q.get('design'))||0),t=PK.template(category,design),c=PK.$('poster');PK.render(c.getContext('2d'),t);PK.$('title').textContent=category+' • Design '+(design+1);PK.$('back').href='./gallery.html?category='+encodeURIComponent(category);PK.$('download').onclick=()=>PK.download(c,'poster-king-'+category+'.png');PK.$('share').onclick=()=>PK.share(c,'poster-king-'+category+'.png');PK.$('edit').onclick=()=>location.href='./editor.html?template='+encodeURIComponent(category)+'&design='+design;</script></body></html>
