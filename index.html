<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6427b4"><meta name="description" content="Free Gujarati Hindi and English festival, daily greetings and suvichar poster maker."><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./pk-style.css"><title>Poster King | Ready-made Posters</title></head><body class="has-nav"><header><div class="topbar"><div class="brand">👑 Poster <em>King</em></div><a href="./editor.html" class="outline">＋ Create</a></div></header><main class="shell"><section class="hero"><h1>દરરોજ નવા સુંદર Posters ✨</h1><p>Ready-made Poster પસંદ કરો, સીધું Download / Share કરો અથવા તમારા ફોટા અને નામ સાથે Edit કરો.</p><button class="primary" onclick="location.href='./categories.html'">Explore Posters →</button></section><input id="search" class="search" placeholder="🔎 Search Good Morning, Suvichar, Diwali..."><div id="sections"></div></main><nav class="bottom-nav"><a href="./" class="active"><span>⌂</span>Home</a><a href="./categories.html"><span>▦</span>Categories</a><a href="./editor.html"><span>✚</span>Create</a><a href="./saved.html"><span>▧</span>My Posters</a><a href="./profile.html"><span>♙</span>Profile</a></nav><script src="./pk-core.js"></script><script>const $=PK.$;const hr=new Date().getHours(),current=hr<11?'Morning':hr<16?'Afternoon':hr<20?'Evening':'Night';const sections=[['🔥 Today’s Picks',[current,'Suvichar','Devotional','Birthday','Business']],['🌅 Good Morning',['Morning']],['💡 Daily Suvichar',['Suvichar']],['🌙 Good Night',['Night']],['🪔 Festivals',['Diwali','Navratri','Janmashtami','Holi','New Year']],['🎂 Special Occasions',['Birthday','Anniversary','Business']]];function render(){const q=$('search').value.trim().toLowerCase(),host=$('sections');host.innerHTML='';sections.forEach(([title,cats])=>{const matching=cats.filter(c=>!q||c.toLowerCase().includes(q)||PK.categories.find(x=>x[0]===c)?.slice(1,5).join(' ').toLowerCase().includes(q));if(!matching.length)return;const section=document.createElement('section');section.className='section';const head=document.createElement('div');head.className='section-title';const h=document.createElement('h2');h.textContent=title;const link=document.createElement('a');link.href='./gallery.html?category='+encodeURIComponent(matching[0]);link.textContent='See all →';head.append(h,link);const shelf=document.createElement('div');shelf.className='shelf';for(let i=0;i<5;i++){const cat=matching[i%matching.length],t=PK.template(cat,i);shelf.append(PK.card(t,()=>location.href='./gallery.html?category='+encodeURIComponent(cat)))}section.append(head,shelf);host.append(section)})}PK.$('search').oninput=render;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
