<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./pk-style.css"><title>My Posters | Poster King</title></head><body class="has-nav"><header><div class="topbar"><a href="./">← Home</a><b>🖼 My Posters</b></div></header><main class="shell"><h1>My Saved Posters</h1><p class="muted">તમારા આ મોબાઇલમાં બનાવેલા છેલ્લાં Posters. Browser Data Clear કરવાથી દૂર થઈ શકે.</p><h2>♥ Favorite Posters</h2><div class="grid" id="favorites"></div><h2>My Downloads</h2><div class="grid" id="grid"></div><div class="empty" id="empty">Editor માંથી Download કરેલા Posters અહીં દેખાશે.</div></main><nav class="bottom-nav"><a href="./"><span>⌂</span>Home</a><a href="./categories.html"><span>▦</span>Categories</a><a href="./editor.html"><span>✚</span>Create</a><a href="./saved.html" class="active"><span>▧</span>My Posters</a><a href="./profile.html"><span>♙</span>Profile</a></nav><script src="./pk-core.js"></script><script>let a=[];try{a=JSON.parse(localStorage.getItem('pk_saved')||'[]')}catch(e){}if(a.length)document.getElementById('empty').hidden=true;let fav=[];try{fav=JSON.parse(localStorage.getItem('pk_favorites')||'[]')}catch(e){}const favHost=document.getElementById('favorites');fav.forEach(key=>{const [category,number]=key.split(':');if(!category||!Number.isFinite(Number(number)))return;const t=PK.template(category,Number(number));favHost.append(PK.card(t,()=>location.href='./preview.html?category='+encodeURIComponent(category)+'&design='+Number(number)))});const grid=document.getElementById('grid');a.forEach((src,i)=>{const card=document.createElement('div');card.className='panel';const img=document.createElement('img');img.src=src;img.style.width='100%';img.style.borderRadius='10px';const link=document.createElement('a');link.href=src;link.download='poster-king-saved-'+i+'.jpg';link.textContent='⬇ Download';card.append(img,link);grid.append(card)});</script></body></html>
